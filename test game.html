<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b30"><title>30M TAP RUN</title><style>
:root{font-family:system-ui,-apple-system,'Pretendard',sans-serif;color:#fff;background:#101b30}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#304d79,#101b30 60%);touch-action:manipulation;user-select:none;-webkit-user-select:none}.wrap{max-width:520px;margin:auto;padding:16px 16px 30px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:1000;font-style:italic;letter-spacing:-1px;font-size:23px}.logo b{color:#faff6b}.pill{border:1px solid #61728b;background:#1d2d46;border-radius:50px;color:white;padding:9px 13px;font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:15px 0}.stat{border:1px solid #48617b;border-radius:14px;background:#1c2d47;padding:11px 8px;text-align:center}.stat small{display:block;color:#adbed2;font-size:11px}.stat strong{display:block;font-size:25px;font-variant-numeric:tabular-nums}.stage{position:relative;border:4px solid #627e9e;border-radius:22px;overflow:hidden;box-shadow:0 16px 36px #0005;background:#518c69;touch-action:manipulation;cursor:pointer}canvas{display:block;width:100%;height:auto;aspect-ratio:3/4.1;pointer-events:none}.stage-note{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);border-radius:50px;background:#091525b8;padding:9px 15px;white-space:nowrap;font-weight:900;pointer-events:none}.burst{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:30px;font-weight:1000;color:#fff86a;text-shadow:0 4px #0009;pointer-events:none;animation:pop .32s ease-out forwards}@keyframes pop{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-140%) scale(1.4)}}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:13px;background:#faff6b;color:#142033;font-weight:900;font-size:15px;padding:13px;cursor:pointer;flex:1}.btn.secondary{background:#2b4261;color:white;border:1px solid #59728b}.foot{font-size:12px;color:#9aafc9;text-align:center;margin:12px}.panel{margin-top:14px;padding:16px;border:1px solid #455b77;background:#182a43;border-radius:17px}.panel h2{margin:0 0 10px;font-size:17px}.sub{font-size:12px;color:#b3c4d6;line-height:1.6}.ranks{padding:0;list-style:none;margin:8px 0}.ranks li{display:flex;justify-content:space-between;border-bottom:1px solid #344863;padding:9px 2px;font-size:14px}.ranks li:last-child{border:0}.tag{font-size:11px;border-radius:99px;padding:4px 7px;background:#30496a;color:#c4def8}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#081429c9;backdrop-filter:blur(3px);padding:18px}.modal{width:100%;max-width:320px;text-align:center;background:#203653;border:1px solid #7691ac;border-radius:21px;padding:22px 18px;box-shadow:0 15px 40px #0009}.modal h1{font-size:28px;margin:4px 0 10px}.modal p{font-size:14px;line-height:1.65;color:#d5e4f4}.modal .big{font-size:44px;font-weight:1000;color:#faff6b}.modal input{width:100%;font-size:16px;border:1px solid #718ba9;border-radius:11px;background:#101d31;color:white;padding:12px;text-align:center;margin:8px 0}.hidden{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #faff6b;outline-offset:2px}
</style></head><body><main class="wrap"><div class="head"><div class="logo">⚡ 30M <b>TAP RUN</b></div><button id="sound" class="pill" aria-label="소리 켜기 또는 끄기">🔊 ON</button></div><div class="stats"><div class="stat"><small>이동 거리</small><strong id="distance">0<span style="font-size:14px">/30m</span></strong></div><div class="stat"><small>기록</small><strong id="time">0.00s</strong></div><div class="stat"><small>터치</small><strong id="taps">0</strong></div></div><section class="stage" id="stage" aria-label="게임 영역. 시작 후 어디든 터치하면 1미터 전진"><canvas id="canvas" width="360" height="492"></canvas><div id="note" class="stage-note">화면 아무 데나 터치하여 달리기!</div><div class="overlay" id="overlay"><div class="modal" id="modal"><div style="font-size:37px">🏃💨</div><h1>30M TAP RUN</h1><p>터치 1번 = 1미터!<br>정확히 <b>30번</b> 터치해서 결승선을 통과하세요.<br>빠를수록 순위가 높아집니다.</p><button class="btn" id="start">달리기 시작!</button></div></div></section><div class="actions"><button class="btn secondary" id="reset">↻ 다시 시작</button><button class="btn" id="share">↗ 친구에게 공유</button></div><div class="panel"><h2>🏆 스피드 랭킹 <span class="tag" id="rankType">내 기기 기록</span></h2><div class="sub" id="rankHelp">기록은 이 기기에 저장됩니다. 온라인 전체 랭킹은 별도 설정 후 활성화됩니다.</div><ol class="ranks" id="ranking"></ol><button class="btn secondary" id="refresh" style="width:100%">랭킹 새로고침</button></div><div class="foot">📱 앱 설치 필요 없음 · GitHub Pages 배포 가능</div></main><script>
// 온라인 랭킹을 활성화하려면 아래 2개를 설정하세요. 설정/SQL은 README.md 참조.
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
const ONLINE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
let distance=0,taps=0,startedAt=0,elapsed=0,mode='intro',muted=false,lastTouch=0,audio=null,particles=[],runnerBounce=0;
const KEY='taprun30_scores_v1';
$('rankType').textContent=ONLINE?'전체 온라인 랭킹':'내 기기 기록';
$('rankHelp').textContent=ONLINE?'인터넷에 연결된 모든 플레이어의 기록입니다.':'기록은 이 기기에 저장됩니다. 온라인 전체 랭킹은 별도 설정 후 활성화됩니다.';
function tone(freq=500,dur=.07,type='sine'){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function ui(){ $('distance').innerHTML=distance+'<span style="font-size:14px">/30m</span>'; $('taps').textContent=taps;$('time').textContent=(elapsed/1000).toFixed(2)+'s';$('note').textContent=mode==='play'?'👆 어디든 터치! 1터치 = 1m':mode==='done'?'🏁 완주 성공!':'터치해서 30m 달리기!'}
function start(){distance=0;taps=0;elapsed=0;startedAt=performance.now();particles=[];mode='play';$('overlay').classList.add('hidden');ui();tone(760,.12)}
function showResult(){mode='done';elapsed=performance.now()-startedAt;ui();tone(880,.12);setTimeout(()=>tone(1175,.2),120);$('overlay').classList.remove('hidden');$('modal').innerHTML=`<div style="font-size:42px">🏆</div><h1>FINISH!</h1><div class="big">${(elapsed/1000).toFixed(2)}s</div><p>30m 완주! 터치 ${taps}회<br>닉네임을 입력해 기록을 저장하세요.</p><input id="nickname" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="nickname"><button class="btn" id="save">기록 저장하기</button><button class="btn secondary" id="again" style="margin-top:8px;width:100%">다시 달리기</button>`;$('nickname').value=localStorage.getItem('taprun30_name')||'';$('save').onclick=saveScore;$('again').onclick=start}
function tap(ev){if(mode!=='play')return;const now=performance.now();if(ev?.type==='click'&&now-lastTouch<350)return;if(ev?.type==='pointerdown')lastTouch=now;distance=Math.min(30,distance+1);taps++;runnerBounce=1;tone(280+distance*15,.045,'triangle');for(let i=0;i<6;i++)particles.push({x:180+(Math.random()-.5)*45,y:335+(Math.random()-.5)*40,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:18});const burst=document.createElement('div');burst.className='burst';burst.textContent='+1m';$('stage').append(burst);setTimeout(()=>burst.remove(),310);if(navigator.vibrate)navigator.vibrate(8);if(distance===30)showResult();ui()}
$('stage').addEventListener('pointerdown',tap);$('stage').addEventListener('click',tap);$('start').onclick=e=>{e.stopPropagation();start()};$('reset').onclick=start;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 OFF':'🔊 ON';if(!muted)tone()};
async function share(){const url=location.protocol.startsWith('http')?location.href.split('#')[0]:'';const data={title:'30M TAP RUN',text:'🏃 나랑 30m 터치 달리기 대결하자! 누가 더 빠를까?',url};if(!url){alert('GitHub Pages에 배포한 뒤 링크 공유가 가능합니다.');return}try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);alert('게임 링크를 복사했어요! 카카오톡에 붙여넣으세요.')}}catch(e){if(e.name!=='AbortError')prompt('이 링크를 복사해서 카카오톡으로 보내세요',url)}}$('share').onclick=share;
function localScores(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function addLocal(s){const scores=[...localScores(),s].sort((a,b)=>a.time_ms-b.time_ms).slice(0,20);localStorage.setItem(KEY,JSON.stringify(scores))}
async function api(path,method='GET',body){const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('HTTP '+r.status);return method==='GET'?r.json():null}
async function saveScore(){const name=($('nickname').value.trim()||'익명').slice(0,12);localStorage.setItem('taprun30_name',name);const score={name,time_ms:Math.round(elapsed),created_at:new Date().toISOString()};addLocal(score);$('save').disabled=true;$('save').textContent='저장 중...';let message='기기에 기록을 저장했어요!';if(ONLINE){try{await api('taprun_scores','POST',score);message='온라인 랭킹에 등록했어요!'}catch{message='온라인 등록 실패. 기기에는 저장했어요.'}}$('save').textContent=message;await loadRanks()}
async function loadRanks(){let scores=localScores();if(ONLINE){try{scores=await api('taprun_scores?select=name,time_ms&order=time_ms.asc&limit=10')}catch{$('rankHelp').textContent='서버 연결 실패 — 임시로 이 기기의 기록을 표시합니다.'}}const root=$('ranking');root.replaceChildren();scores.slice(0,10).forEach((s,i)=>{const li=document.createElement('li');const name=document.createElement('span');name.textContent=`${['🥇','🥈','🥉'][i]||String(i+1)+'위'} ${s.name}`;const time=document.createElement('b');time.textContent=(s.time_ms/1000).toFixed(2)+'s';li.append(name,time);root.append(li)});if(!scores.length){const li=document.createElement('li');li.textContent='아직 기록이 없어요. 첫 주자가 되어보세요!';root.append(li)}}$('refresh').onclick=loadRanks;
function draw(now){const w=360,h=492;ctx.clearRect(0,0,w,h);ctx.fillStyle='#438462';ctx.fillRect(0,0,w,h);for(let i=0;i<30;i++){ctx.fillStyle=i%2?'#4c8e66':'#478a63';ctx.fillRect(0,(i*49+(distance*36)%49),360,25)}ctx.fillStyle='#af6c50';ctx.fillRect(54,0,252,h);ctx.fillStyle='#c67c5b';ctx.fillRect(66,0,228,h);ctx.fillStyle='#e49b77';ctx.fillRect(70,0,106,h);ctx.fillStyle='#d48d6d';ctx.fillRect(183,0,106,h);ctx.strokeStyle='#fff6';ctx.setLineDash([24,23]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,h);ctx.stroke();ctx.setLineDash([]);
// Moving meter marks and finish line approaching in overhead view
for(let meter=1;meter<=30;meter++){let y=330-(meter-distance)*36;if(y< -30||y>h+30)continue;if(meter%5===0){ctx.fillStyle='#fff9';ctx.font='bold 13px system-ui';ctx.fillText(meter+'m',76,y-8)}}const finishY=330-(30-distance)*36;if(finishY>-48&&finishY<h+48){for(let x=70;x<290;x+=22)for(let k=0;k<2;k++){ctx.fillStyle=((x/22|0)+k)%2?'#171e2a':'#fff';ctx.fillRect(x,finishY+k*15,22,15)}ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.fillText('FINISH',147,finishY-10)}
const bob=runnerBounce>0?Math.sin((1-runnerBounce)*Math.PI*5)*5:Math.sin(now/220)*2;runnerBounce=Math.max(0,runnerBounce-.055);ctx.save();ctx.translate(180,330+bob);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,15,27,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263b65';ctx.fillRect(-16,9,11,25);ctx.fillRect(5,9,11,25);ctx.fillStyle='#fee17a';ctx.fillRect(-23,-9,12,27);ctx.fillRect(11,-9,12,27);ctx.fillStyle='#ffdb54';ctx.beginPath();ctx.roundRect(-18,-20,36,40,9);ctx.fill();ctx.fillStyle='#ff4f68';ctx.fillRect(-18,-16,36,9);ctx.fillStyle='#f6bc92';ctx.beginPath();ctx.arc(0,-22,16,0,7);ctx.fill();ctx.fillStyle='#30283f';ctx.beginPath();ctx.arc(0,-26,16,Math.PI,2*Math.PI);ctx.fill();ctx.restore();particles=particles.filter(p=>p.life-->0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=`rgba(255,250,110,${p.life/18})`;ctx.fillRect(p.x,p.y,5,5)});if(mode==='play'){$('time').textContent=((now-startedAt)/1000).toFixed(2)+'s';elapsed=now-startedAt}requestAnimationFrame(draw)}ui();loadRanks();requestAnimationFrame(draw);
</script></body></html>
